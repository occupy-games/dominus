name: macOS releases

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dominus-macos-releases
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_commit_releases.py
